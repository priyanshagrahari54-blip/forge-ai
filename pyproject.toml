[build-system]
requires = [
    # Python 3.8 needs setuptools < 76: setuptools 76 dropped 3.8 (latest
    # admitting 3.8 is 75.3.4). Newer interpreters are left uncapped so the
    # modern build tracks current setuptools.
    "setuptools>=68,<76; python_version < '3.9'",
    "setuptools>=68; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai"
version = "0.1.0"
description = "Forge AI - autonomous software engineering foundation"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Dependency floors are the versions Forge is written against; the ceilings
# exist because every one of these projects has shipped a release that dropped
# Python 3.8, and an unbounded ">=X" makes the 3.8 install depend on resolver
# backtracking plus correct upstream `Requires-Python` metadata.
#
# The `python_version < '3.9'` lines pin the newest release of each project
# that still admits 3.8 (verified against PyPI `Requires-Python`):
#   pydantic 2.10.6 · fastapi 0.124.4 · uvicorn 0.33.0 · pytest 8.3.5
# The `>= '3.9'` lines keep the modern build uncapped within its major, so
# Python 3.11+ is not held back by the legacy floor.
#
# `requirements/py38.txt` pins the exact resolved 3.8 set for reproducible
# installs (CI and the Windows 7 32-bit target).
dependencies = [
    "pydantic>=2.0,<2.11; python_version < '3.9'",
    "pydantic>=2.0,<3; python_version >= '3.9'",
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<0.125; python_version < '3.9'",
    "fastapi>=0.110,<1; python_version >= '3.9'",
    "uvicorn>=0.29,<0.34; python_version < '3.9'",
    "uvicorn>=0.29,<1; python_version >= '3.9'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<8.4; python_version < '3.9'",
    "pytest>=8.0,<10; python_version >= '3.9'",
    "httpx>=0.27,<1",
    # Static minimum-version gate (`vermin -t=3.8-`). Stdlib-only, and it
    # declares >=3.0, so the same pin works on every interpreter in the
    # matrix including 3.8.
    "vermin>=1.6,<2",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Two known third-party deprecations (starlette's httpx-based TestClient
# shim and anyio's BlockingPortal alias) are filtered so the suite output
# stays clean. Warnings from Forge's own code are never filtered here.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
