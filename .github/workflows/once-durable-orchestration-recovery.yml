name: one-shot durable orchestration recovery bootstrap

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply recovery patch
        run: python scripts/apply_durable_orchestration_recovery.py

      - name: Commit and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge/core/dag_scheduler.py forge/control/control_plane.py scripts/apply_durable_orchestration_recovery.py tests/test_orchestration_restart.py
          git rm .github/workflows/once-durable-orchestration-recovery.yml
          git commit -m "fix: resume durable orchestrations across server restart"
          git push origin HEAD:main
