name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # TEMP DEBUG (revert after 3.8 diagnosis): echo failing test
        # names as workflow annotations so they are visible via the API.
        run: |
          set +e
          python -m pytest -q --tb=no -rf > /tmp/pytest_out.txt 2>&1
          code=$?
          grep -E "^(FAILED|ERROR)" /tmp/pytest_out.txt | head -n 40 | while IFS= read -r line; do
            echo "::error title=pytest-failure::$line"
          done
          tail -n 4 /tmp/pytest_out.txt
          exit $code

      - name: Compile the package
        run: python -m compileall forge

      - name: Check for whitespace errors and conflict markers
        run: git diff --check
