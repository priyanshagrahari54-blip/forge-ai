name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8','3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.8" ]; then
            python -m pip install -r requirements/py38-dev.txt
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[dev]"
          fi
      - run: python -m pytest -q
      - name: Forge Web startup smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from forge_web import build_app

          app = build_app()
          with TestClient(app) as client:
              response = client.get("/api/v1/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload.get("status") == "ok", payload
          print("Forge Web startup smoke test passed")
          PY
      - run: python -m compileall -q forge
      - run: git diff --check
