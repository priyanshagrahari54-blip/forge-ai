name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8','3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.8" ]; then
            python -m pip install -r requirements/py38-dev.txt
            python -m pip install -e . --no-deps
          elif [ "${{ matrix.python-version }}" = "3.11" ]; then
            # 3.11 is the interpreter the deployment image runs, so this leg
            # installs exactly the extras the Dockerfile installs.
            python -m pip install -e ".[dev,media]"
          else
            python -m pip install -e ".[dev]"
          fi
      - run: python -m pytest -q
      - name: Forge Web startup smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from forge_web import build_app

          app = build_app()
          with TestClient(app) as client:
              response = client.get("/api/v1/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload.get("status") == "ok", payload
          print("Forge Web startup smoke test passed")
          PY
      - name: Local capability backends (deployment configuration)
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import importlib.util

          from forge.models.local_capabilities import probe_local_capabilities

          report = probe_local_capabilities()
          for name, item in sorted(report["reports"].items()):
              print(f"{name}: {item.get('probe')} {item.get('reason', '')}")
          verified = set(report["verified"])
          #: The image installs these packages. If one is present but its probe
          #: did not pass, the deployment would advertise a capability it
          #: cannot serve — so that mismatch fails here, not in production.
          required = {"PIL": ("vision", "image_generation"),
                      "espeakng_loader": ("text_to_speech",),
                      "pocketsphinx": ("speech_to_text",)}
          for module, capabilities in required.items():
              if importlib.util.find_spec(module) is None:
                  print(f"{module}: not installed on this job")
                  continue
              for capability in capabilities:
                  assert capability in verified, report["reports"].get(capability)
          print("verified local capabilities:", sorted(verified))
          PY
      - run: python -m compileall -q forge
      - run: git diff --check
